# Alembic CLI configuration for the core API.
#   uv run --package lattice-core alembic -c services/core-api/alembic.ini upgrade head
#   uv run --package lattice-core alembic -c services/core-api/alembic.ini revision --autogenerate -m "..."
# The database URL comes from CORE_DATABASE_URL (see lattice_core/config.py).
# The API also upgrades itself to head on start-up (lattice_core/seed.py).
[alembic]
script_location = %(here)s/src/lattice_core/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
