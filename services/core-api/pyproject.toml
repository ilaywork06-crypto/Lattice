[project]
name = "lattice-core"
version = "0.1.0"
description = "Lattice core API — assets, relationships, change-requests, inventory, audit"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "email-validator>=2.2",
    "httpx>=0.27",
    "redis>=5.0",
    "lattice-shared",
    "alembic>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lattice_core"]
