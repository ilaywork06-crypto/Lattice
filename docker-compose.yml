# Lattice — full development stack.
#   docker compose up --build
#
# Exposes:
#   frontend            → http://localhost:8080
#   core API (docs)     → http://localhost:8000/docs
#   notification API    → http://localhost:8001/docs
#   MailHog (emails)    → http://localhost:8025
name: lattice

services:
  # ───────────────────────── data stores ─────────────────────────
  postgres-core:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${CORE_POSTGRES_USER:-lattice}
      POSTGRES_PASSWORD: ${CORE_POSTGRES_PASSWORD:-lattice_dev_pw}
      POSTGRES_DB: ${CORE_POSTGRES_DB:-lattice_core}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_core:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CORE_POSTGRES_USER:-lattice} -d ${CORE_POSTGRES_DB:-lattice_core}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-notify:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${NOTIFY_POSTGRES_USER:-lattice}
      POSTGRES_PASSWORD: ${NOTIFY_POSTGRES_PASSWORD:-lattice_dev_pw}
      POSTGRES_DB: ${NOTIFY_POSTGRES_DB:-lattice_notify}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_notify:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFY_POSTGRES_USER:-lattice} -d ${NOTIFY_POSTGRES_DB:-lattice_notify}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  # ───────────────────────── services ─────────────────────────
  core-api:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    environment:
      CORE_DATABASE_URL: postgresql+psycopg://${CORE_POSTGRES_USER:-lattice}:${CORE_POSTGRES_PASSWORD:-lattice_dev_pw}@postgres-core:5432/${CORE_POSTGRES_DB:-lattice_core}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@lattice.io}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin1234}
    ports:
      - "8000:8000"
    depends_on:
      postgres-core:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      NOTIFY_DATABASE_URL: postgresql+psycopg://${NOTIFY_POSTGRES_USER:-lattice}:${NOTIFY_POSTGRES_PASSWORD:-lattice_dev_pw}@postgres-notify:5432/${NOTIFY_POSTGRES_DB:-lattice_notify}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM:-lattice@lattice.io}
      SMTP_USE_TLS: "false"
    ports:
      - "8001:8001"
    depends_on:
      postgres-notify:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_CORE_API_URL: ${VITE_CORE_API_URL:-http://localhost:8000}
        VITE_NOTIFICATION_API_URL: ${VITE_NOTIFICATION_API_URL:-http://localhost:8001}
    ports:
      - "8080:80"
    depends_on:
      - core-api
      - notification-service

volumes:
  pgdata_core:
  pgdata_notify:
