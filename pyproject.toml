[project]
name = "lattice"
version = "0.1.0"
description = "Lattice — hierarchical hardware asset tracking (setups / assemblies / cards)"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
lattice-shared = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI Depends() in argument defaults
    "B904",  # re-raising HTTPException inside except is idiomatic in FastAPI
    "UP042", # deliberate (str, Enum) mixin for clean FastAPI/Pydantic serialization
]

[tool.ruff.lint.per-file-ignores]
# Autogenerated Alembic revisions: one long line per column is the readable form.
"**/migrations/versions/*.py" = ["E501"]
